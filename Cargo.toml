[package]
name = "tauri-plugin-android-fs"
version = "30.1.0"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-android-fs"
exclude = [
    "target",
    "android/.gradle/",
    "android/local.properties",
    "android/.idea",
    "android/gradle",
    "android/gradlew",
    "android/gradlew.bat",
    ".check_all_features.sh",
    ".my_memo.md"
]
build = "build.rs"
license = "MIT OR Apache-2.0"
keywords = ["tauri", "android", "file", "fs", "dialog"]
authors = ["OkaYu"]
description = "Android file system API for Tauri."
repository = "https://github.com/aiueo13/tauri-plugin-android-fs"
readme = "README.md"

[package.metadata.platforms.support]
android = { level = "full", notes = "" }
windows = { level = "none", notes = "" }
linux = { level = "none", notes = "" }
macos = { level = "none", notes = "" }
ios = { level = "none", notes = "" }

[features]
default = ["commands"]
commands = []
protocol_content = ["dep:http-range"]
protocol_thumbnail = []
custom_file_provider = []
file_provider = ["custom_file_provider"]
notification_permission = []
legacy_storage_permission = []
legacy_storage_permission_include_android_10 = []
# 以下は互換性の為に残す
protocol-content = ["protocol_content"]
protocol-thumbnail = ["protocol_thumbnail"]
file-provider = ["file_provider"]
custom-file-provider = ["custom_file_provider"]
notification-permission = ["notification_permission"]
legacy-storage-permission = ["legacy_storage_permission"]
legacy-storage-permission-include-android-10 = ["legacy_storage_permission_include_android_10"]

[dependencies]
tauri = { version = "^2.12.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = "2"
tauri-plugin-fs = "2"
sync_async = "0.1.0"
schemars = "0.8"
glob = "0.3"
percent-encoding = "2"
http-range = { version = "0.1.5", optional = true }
base64 = "0.23.1"
getrandom = "0.4.3"
bytemuck = "1.25"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
libc = "^0.2.190"

[build-dependencies]
tauri-plugin = { version = "^2.7.0", features = ["build"] }
schemars = "0.8"
serde = "1"